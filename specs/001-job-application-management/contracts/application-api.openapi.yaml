openapi: 3.1.0
info:
  title: Personal Job Application Management API
  version: 1.0.0-draft
  description: Pragmatic browser-facing contract for the single-user personal job-search workspace. These route handlers are part of the one Next.js modular monolith, not a separately deployable API service. Requests are authorized through the explicit current-owner boundary; MVP permits only the configured owner.
servers:
  - url: /api
paths:
  /applications:
    get:
      summary: List Kanban applications with filters
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { description: Kanban card collection }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a discovered opportunity
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationInput' } } } }
      responses:
        '201': { description: Created application }
        '400': { $ref: '#/components/responses/ValidationError' }
  /applications/{applicationId}:
    get:
      summary: Read complete Application Workspace
      parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
      responses:
        '200': { description: Application workspace, including ETag version token }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update an application using optimistic concurrency
      parameters: [ { $ref: '#/components/parameters/ApplicationId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationInput' } } } }
      responses:
        '200': { description: Updated application and new ETag }
        '412': { $ref: '#/components/responses/Conflict' }
  /applications/{applicationId}/status:
    post:
      summary: Change status and append history after successful save
      parameters: [ { $ref: '#/components/parameters/ApplicationId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [statusId], properties: { statusId: { type: string } } } } } }
      responses:
        '200': { description: Status and generated timeline event }
        '412': { $ref: '#/components/responses/Conflict' }
  /applications/{applicationId}/submission:
    post:
      summary: Record the application's one immutable formal submission
      parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionInput' } } } }
      responses:
        '201': { description: Formal Submission and generated timeline event }
        '409': { description: Application already has its formal submission; create a new application to apply again. }
  /applications/{applicationId}/timeline-events:
    post:
      summary: Add manual timeline event
      parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
      responses: { '201': { description: Timeline event created } }
  /applications/{applicationId}/preparation-tasks:
    post:
      summary: Add preparation task
      parameters: [ { $ref: '#/components/parameters/ApplicationId' } ]
      responses: { '201': { description: Task created } }
  /search:
    get:
      summary: Search application context and apply structured filters
      parameters: [ { $ref: '#/components/parameters/Search' } ]
      responses: { '200': { description: Ranked results } }
  /exports:
    post:
      summary: Create a portable owner backup export
      responses:
        '200': { description: ZIP containing structured JSON and/or CSV data, manifest, document metadata/provider references, retrievable authorized binaries, and entries explaining unavailable binaries. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /storage/google-drive/authorize:
    post:
      summary: Begin user-approved Google Drive authorization
      responses: { '200': { description: Authorization URL or completed state } }
components:
  parameters:
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string } }
    Status: { name: status, in: query, schema: { type: string } }
    Search: { name: q, in: query, schema: { type: string, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Version token read from the current record. }
  schemas:
    ApplicationInput:
      type: object
      required: [companyName, positionTitle, discoveredAt, statusId]
      properties:
        companyName: { type: string, minLength: 1, maxLength: 200 }
        positionTitle: { type: string, minLength: 1, maxLength: 200 }
        discoveredAt: { type: string, format: date-time }
        statusId: { type: string }
        location: { type: string }
        country: { type: string }
        notesMarkdown: { type: string }
    SubmissionInput:
      type: object
      description: The original formal application only. Later employer-requested documents and materials use application documents and lifecycle endpoints, not this operation.
      required: [submittedAt, method, cvAssetId]
      properties:
        submittedAt: { type: string, format: date-time }
        method: { type: string }
        cvAssetId: { type: string }
        coverLetterAssetId: { type: string }
        notes: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        currentVersion: { type: string }
        currentRecord: { type: object }
  responses:
    Unauthorized: { description: Owner authentication required }
    NotFound: { description: Record not found or unavailable to owner }
    ValidationError: { description: Invalid request data, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Stale version; response includes current record for review, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
